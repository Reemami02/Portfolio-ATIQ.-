<section class="cart-page">
    <h1>Your Bag</h1>
    @if (cart?.items?.length)
     {@for (item of cart.items;track item.productId._id)
         {<article class="cart-item">
            <img [src]="item.productId.image || 'https://placehold.co/100x120?text=ATIQ'" [alt]="item.productId.name">
            <div>
                <h3>{{item.productId.name}}</h3>
                <p>{{item.productId.price}} EGP</p>
                <p>Quantity: {{item.quantity}}</p>
                <button (click)="change(item,item.quantity-1)" [disabled]="item.quantity<=1">−</button> 
                <button (click)="change(item,item.quantity+1)">+</button>
                 <button class="remove" (click)="remove(item)">Remove</button>
                </div>
                  </article>}<h2>Total: {{total}} EGP</h2>
                  <button type="button" (click)="checkout()">Place Order</button>
                } @else{
                    <p>Your bag is empty.</p>
                }
                     @if (message) {<p>{{message}}</p>}
                    </section>
