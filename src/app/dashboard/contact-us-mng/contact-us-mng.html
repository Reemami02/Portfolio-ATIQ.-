<section class="admin-page"><div class="admin-heading"><p>ATIQ / ADMIN</p><h1>Contact & Messages</h1></div><form class="admin-form" #f="ngForm" (ngSubmit)="save()"><h2>Contact Information</h2><div class="form-grid"><label>Email<input name="email" [(ngModel)]="info.email" required></label><label>Phone<input name="phone" [(ngModel)]="info.phone" required></label><label class="wide">Address<input name="address" [(ngModel)]="info.address" required></label><label>Facebook URL<input name="facebookLink" [(ngModel)]="info.facebookLink"></label><label>Instagram URL<input name="instagramLink" [(ngModel)]="info.instagramLink"></label><label>Twitter URL<input name="twitterLink" [(ngModel)]="info.twitterLink"></label></div><button type="submit" [disabled]="f.invalid">Save Contact Info</button>@if (status) {<p>{{status}}</p>}</form><div class="admin-list"><h2>Customer Messages ({{messages.length}})</h2>@for (m of messages;track m._id) {<article class="admin-item"><div class="item-info"><h3>{{m.name}}</h3><p>{{m.email}} · {{m.createdAt | date:'medium'}}</p><p>{{m.message}}</p></div><button type="button" class="danger" (click)="deleteMessage(m._id)">Delete</button></article>} @empty {<p>No messages yet.</p>}</div></section>
