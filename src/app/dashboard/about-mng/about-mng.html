<section class="admin-page"><div class="admin-heading"><p>ATIQ / ADMIN</p><h1>Edit About Page</h1></div><form class="admin-form" #f="ngForm" (ngSubmit)="save()"><div class="form-grid">
<label>Hero title<input name="hTitle" [(ngModel)]="data.hTitle"></label><label>Hero description<textarea name="hDescription" [(ngModel)]="data.hDescription"></textarea></label>
<label>Story title<input name="storyTitle" [(ngModel)]="data.storyTitle"></label><label>Story image URL<input name="storyImage" [(ngModel)]="data.storyImage"></label><label class="wide">Story paragraphs (one paragraph per line)<textarea name="paragraphs" rows="5" [(ngModel)]="paragraphs"></textarea></label>
<label>Mission title<input name="mTitle" [(ngModel)]="data.mTitle"></label><label>Mission description<textarea name="mDescription" [(ngModel)]="data.mDescription"></textarea></label><label>Vision title<input name="vTitle" [(ngModel)]="data.vTitle"></label><label>Vision description<textarea name="vDescription" [(ngModel)]="data.vDescription"></textarea></label>
<label>Closing title<input name="closingTitle" [(ngModel)]="data.closingTitle"></label><label>Closing description<textarea name="closingDescription" [(ngModel)]="data.closingDescription"></textarea></label></div><button type="submit">Save About Page</button>@if (message) {<p>{{message}}</p>}</form></section>
